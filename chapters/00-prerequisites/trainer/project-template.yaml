apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: project-request
  namespace: openshift-config
objects:

# 1 — Project (cluster-scoped, no namespace)
  - apiVersion: project.openshift.io/v1
    kind: Project
    metadata:
      name: ${PROJECT_NAME}
      annotations:
        openshift.io/display-name: ${PROJECT_DISPLAYNAME}
        openshift.io/description:  ${PROJECT_DESCRIPTION}
        openshift.io/requester:    ${PROJECT_REQUESTING_USER}
      labels:
        region: apac-workshop

# 2 — RoleBinding: requesting user
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: admin
      namespace: ${PROJECT_NAME}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: ${PROJECT_ADMIN_USER}

# 3 — RoleBinding: group admin
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: group-admin
      namespace: ${PROJECT_NAME}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: ${PROJECT_ADMIN_GROUP}

# 4 — LimitRange
  - apiVersion: v1
    kind: LimitRange
    metadata:
      name: financeflow-limits
      namespace: ${PROJECT_NAME}
    spec:
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 256Mi
          defaultRequest:
            cpu: 100m
            memory: 128Mi
          max:
            cpu: "2"
            memory: 1Gi
          min:
            cpu: 10m
            memory: 32Mi

# 5 — ResourceQuota
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: financeflow-quota
      namespace: ${PROJECT_NAME}
    spec:
      hard:
        pods: "20"
        requests.cpu: "2"
        limits.cpu: "4"
        requests.memory: 2Gi
        limits.memory: 4Gi
        persistentvolumeclaims: "5"
        requests.storage: 50Gi
        services.nodeports: "0"
        services.loadbalancers: "0"

parameters:
  - name: PROJECT_NAME
    required: true
  - name: PROJECT_DISPLAYNAME
    value: ""
  - name: PROJECT_DESCRIPTION
    value: ""
  - name: PROJECT_ADMIN_USER
    required: true
  - name: PROJECT_ADMIN_GROUP
    required: true
  - name: PROJECT_REQUESTING_USER
    value: ""